<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>ExchangeTreasurer</title>
  <!-- A ledger "T": the line a treasurer rules under a column before totalling
       it. Inverts against dark browser chrome the way the PNG pair does. -->
  <style>
    .ground { fill: #10202f; }
    .glyph { fill: #ffffff; }
    .rule { fill: #0e6f62; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #eef1f5; }
      .glyph { fill: #10202f; }
    }
  </style>
  <rect class="ground" width="180" height="180" rx="37" />
  <rect class="glyph" x="40" y="46" width="100" height="20" rx="3" />
  <rect class="glyph" x="80" y="46" width="20" height="74" rx="3" />
  <rect class="rule" x="40" y="132" width="100" height="8" rx="4" />
</svg>
